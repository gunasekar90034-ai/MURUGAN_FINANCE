
name: Murugan Finance APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android.yml'
      - '*.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Source ZIP not found"
            exit 1
          fi
          unzip -q "$ZIP"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug -p WeeklyFinanceAndroid

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Murugan-Finance-APK
          path: WeeklyFinanceAndroid/app/build/outputs/apk/debug/app-debug.apk
