
name: Murugan Finance APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q WeeklyFinanceAndroid_Source.zip -d extracted
          PROJECT_DIR=$(find extracted -name build.gradle -not -path '*/.gradle/*' | grep '/app/build.gradle$' | head -1 | sed 's#/app/build.gradle##')
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Murugan-Finance-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
